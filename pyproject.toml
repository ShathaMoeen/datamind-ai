[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datamind-ai"
version = "0.1.0"
description = "AI-powered data analysis platform combining agents, RAG, and deterministic Python tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0,<5.0",
    "fastapi[standard]>=0.115,<1.0",
    "openai>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "docs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
